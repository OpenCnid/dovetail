# What this runs, and why both operating systems.
#
# The Linux leg is not symmetry for its own sake. The bug that prompted this
# workflow -- a test that rebuilt a path from a file:// URI by stripping the
# scheme textually -- passed on Windows for two releases and failed on Linux
# only, because a Windows file URI carries a drive letter and a POSIX one
# starts with the slash the strip removed. One platform is how that survived.
#
# `fail-fast: false` for the same reason: when one leg goes red the other one's
# result is the interesting half, and cancelling it hides exactly the
# platform-shaped difference this exists to surface.
#
# Not covered here, and worth knowing:
#   * `test-skills.sh` runs its static layer only. The live layer installs the
#     pack into a throwaway CLAUDE_CONFIG_DIR and invokes each skill, which
#     needs two things: the `claude` CLI on PATH, and a shell that propagates
#     CLAUDE_CONFIG_DIR to it. A POSIX shell invoking a Windows claude.exe does
#     not, so the layer now proves the redirect took effect and exits 2 without
#     running when it cannot. It needs no login and costs no API turn, so it is
#     addable -- it just is not added yet, and adding it means deciding whether
#     that exit 2 reads as a skip or a failure. Neither runner is affected:
#     ubuntu-latest and windows-latest each run a native CLI.
#   * A skill that loads is still not a skill that works. Nothing here measures
#     whether a loaded skill changes what the model does.
name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read, and only because the checkout needs it — nothing else in the job is
# authorised at all: pip reaches PyPI, apt reaches Ubuntu's mirrors, and every
# script below runs against local objects or a fixture under $TMPDIR. No
# `GH_TOKEN` is exported here either, which is why the release gate's check 6
# takes its skip branch rather than failing on a scope this block does not hold.
#
# Stated because this is the workflow that runs code from a pull request head.
permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      # Pinned to a commit rather than to `v7`, and the comment is what makes
      # the pin re-checkable: a bare SHA says which code runs and nothing about
      # whether it is still the code upstream calls v7.
      #
      # `@v7` is not a version, it is a pointer somebody else force-moves.
      # `actions/checkout` ships `update-main-version.yml`, whose two steps are
      # `git tag -f ${major}` and `git push origin ${major} --force`;
      # `actions/setup-python` re-points its major from a `release: [released]`
      # trigger. Both had moved before anybody here would have noticed: `v6` is
      # eleven commits past `v6.0.0` upstream, and identical to `v6.1.0`. So a
      # green run of this workflow is evidence about whatever those tags pointed
      # at that morning, which is the thing a check is supposed to rule out.
      #
      # Re-checking a pin is one call — `gh api
      # repos/actions/checkout/git/ref/tags/v7` — and the release name beside it
      # is what turns the answer into agreement or disagreement.
      # (Resolved 2026-08-06; both `v7` refs were lightweight, so the ref SHA is
      # the commit SHA. Sibling patch tags in those repositories are annotated,
      # where the ref SHA would be a tag object instead.)
      #
      # `persist-credentials: false` because no step below this one addresses
      # the remote: every `git` call they reach is local plumbing or runs
      # against a fixture repository under $TMPDIR, and the release test
      # scripts stub `gh` onto PATH. Stated without a step count on purpose —
      # a number here would go stale silently the next time a step is added,
      # and the property to re-check is "does it touch the remote", not "are
      # there still N of them". This is also the job where persisting
      # costs something — on `pull_request` it runs shell and Python out of the
      # proposed head, and the credential would sit in that tree's .git/config
      # buying no step anything. The release workflows keep theirs, and say why.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      # PyYAML is the skill's one non-stdlib dependency, and after this line CI
      # installs nothing else.
      #
      # `pytest` used to sit ahead of the `-r`, named on the command line with
      # no version at all: a third-party package on every run, declared in no
      # file, resolving to whatever was newest that morning, and invisible to
      # any check because nothing reads a pip line for package names. It was
      # only ever the runner — the comment that used to be here said so, and it
      # was right. Every test in the suite is stdlib `unittest`, and all 789 of
      # them pass with no third-party runner installed at all (measured
      # 2026-08-06, CPython 3.13.1, Windows 10 10.0.19045: `Ran 789 tests …
      # OK (skipped=2)`). Deleting a dependency is better than bounding one.
      - name: Install dependencies
        run: >-
          python -m pip install --disable-pip-version-check --quiet
          -r skills/better-skill-creator/requirements.txt

      # Preinstalled on GitHub's Ubuntu images, but installing when absent keeps
      # --strict below from turning a missing tool into a red build.
      - name: Ensure shellcheck
        if: runner.os == 'Linux'
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          fi
          shellcheck --version

      # Fails when skills/ and the lists in install.sh and test-skills.sh
      # disagree, so a skill added to one and not the other cannot install on
      # one route and go missing on the other.
      - name: Skill inventory
        shell: bash
        run: bash scripts/test-skills.sh --static

      # Load-bearing rather than tidy: the marketplace entry is strict: true and
      # `claude plugin tag` refuses to tag when the manifests disagree.
      - name: Version agreement
        shell: bash
        run: bash scripts/bump-version.sh --check

      # --strict on Linux only, where shellcheck is guaranteed above. On Windows
      # the semantic pass is skipped and the script says so rather than passing
      # quietly, which is the behaviour --strict would otherwise fail on.
      - name: Shell lint
        shell: bash
        run: bash scripts/lint-shell.sh ${{ runner.os == 'Linux' && '--strict' || '' }}

      # The third-party half of what this workflow runs. Everything above grades
      # code written here; this grades the code that arrives from somewhere else
      # — every `uses:` naming a commit rather than a tag its owner force-moves,
      # and every Python distribution named in a requirements file with a floor
      # rather than on a pip command line where no policy check looks.
      #
      # It runs on both legs even though its subject is platform-independent:
      # the two runners resolve `git ls-files` and glob paths differently enough
      # that a check about file selection is worth asking on each.
      - name: Supply chain
        shell: bash
        run: bash scripts/check-supply-chain.sh

      # The release gate takes two inputs from outside itself. One is the tag
      # name, chosen by whoever pushes it: this asserts no workflow interpolates
      # such a value into a `run:` body, and that check-release.sh refuses a tag
      # it cannot parse instead of carrying the text onward. It also builds a
      # throwaway repository with a tag, a later commit on `main`, and a dirty
      # working tree, and asserts HEAD mode grades HEAD there rather than the
      # tag — that it refuses a HEAD which is merely an ancestor of `main`,
      # while explicit-tag mode, where a released tag is always behind the tip,
      # still accepts one — and that all six checks grade the commit under test
      # rather than the files lying in the working tree.
      #
      # The other input is that commit: grading its files means reading its
      # `.version-bump.json` to learn which files, so the commit names paths the
      # gate opens. A listed `../x` truncated a file outside the snapshot, before
      # `git show` ever ran. The last section asserts such a path is refused and
      # that a canary outside the snapshot survives byte for byte. The Windows
      # leg is not redundant here: a backslash is a separator there and one
      # filename on Linux, so `..\x` traverses on exactly one of these runners.
      - name: Release-gate tests
        shell: bash
        run: bash scripts/test-release-check.sh

      # The other half of the same subject, checked apart because it fails
      # apart: that gate answers whether a release should have happened, and
      # this asserts there is no route to a tag that does not wait for it. It
      # reads the permission blocks — the job that can write waits on one that
      # cannot, and `release.yml`, which starts from a tag push and therefore
      # runs after the ref exists, holds no write permission at all — then runs
      # `publish-release.sh` against a throwaway repository on every input that
      # should stop it, with a stubbed `gh` recording whether anything wrote.
      - name: Release-publish tests
        shell: bash
        run: bash scripts/test-release-publish.sh

      # The third question about a release, and the one the other two cannot
      # ask: given a tag that already shipped, what is actually established
      # about it. `check-release.sh` resolves a tag with `git rev-list -n 1`,
      # which reaches the commit through an annotated object and a lightweight
      # ref alike, so the tag object itself — and whether anything vouches for
      # it — is invisible to the gate by construction. This asserts that
      # `verify-release.sh` reports the three states apart: established, a real
      # negative, and could-not-ask. The last is the one worth a CI step, because
      # a verifier that reports an unverifiable signature as a pass is
      # indistinguishable from one that verified something.
      - name: Release-integrity tests
        shell: bash
        run: bash scripts/test-release-integrity.sh

      # `-s tests -t .` rather than a bare `discover`: `tests/` is a package and
      # its modules import siblings as `tests.<name>`, so the top level has to
      # stay the skill root or those imports do not resolve.
      #
      # One consequence of dropping pytest, named here rather than discovered:
      # a bare `def test_x()` at module level is a test to pytest and is not one
      # to `unittest`, which collects `TestCase` subclasses. Nothing in the
      # suite is written that way today — there is no `import pytest` and no
      # `pytest.` anywhere under this skill — but a test added in that style
      # would not run rather than fail, which is the quiet direction.
      - name: Tests
        shell: bash
        working-directory: skills/better-skill-creator
        run: python -m unittest discover -s tests -t . -q
