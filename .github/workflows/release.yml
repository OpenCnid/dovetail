# The check `checks.yml` structurally cannot do.
#
# `checks.yml` runs on pushes and pull requests, so it validates commits. It
# says nothing about tags, and a tag is a pointer -- it can be moved, or created
# from anywhere, including a commit that never saw CI. At 0.4.0 that gap was not
# hypothetical: the tag stayed where it was while four green commits landed on
# `main` behind it, and the published release kept shipping the state before
# them for as long as nobody noticed.
#
# So this runs on the tag itself and asks whether `checks` already concluded
# success on that exact SHA -- which, of a tag, is a question only something
# triggered by the tag can ask.
#
# `workflow_dispatch` runs the same script in its HEAD mode, which answers "is
# main releasable right now?" before anybody tags anything.
#
# The two steps below exist because that used to be one step distinguishing the
# cases by whether `RELEASE_TAG` was empty, and emptiness is a weaker signal than
# it looks. `github.ref_type` is `tag` for a dispatch launched from a tag ref as
# well as for a tag push, so the ternary sent a hand-run dispatch down the tag
# path; and check-release.sh's no-tag form then resolved an existing tag anyway.
# Each step now names the mode it wants and `if:` decides which one runs, on
# `github.event_name`, which is the field that actually distinguishes the events.
name: release

on:
  push:
    tags: ['dovetail--v*']
  workflow_dispatch:

# `actions: read` is the one addition over checks.yml: reading whether a run
# succeeded on a SHA is an Actions API call, and the default token cannot make
# it without this.
permissions:
  contents: read
  actions: read

jobs:
  release-check:
    name: release check
    runs-on: ubuntu-latest

    steps:
      # fetch-depth: 0 because the default is a one-commit shallow clone, and
      # `git merge-base --is-ancestor` on a graft point answers a question about
      # the truncation rather than about the history.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Belt and braces: the ancestry check needs `origin/main` to exist, and
      # which remote-tracking refs a tag build ends up with is not the thing to
      # bet a release gate on. Idempotent, and free once the objects are local.
      - name: Fetch main
        run: git fetch --no-tags origin +main:refs/remotes/origin/main

      # The tag reaches the script as an argument and never as text spliced into
      # this line. `github.ref_name` is whatever the pusher named the ref, and
      # `${{ }}` substitutes into the shell source *before* bash parses it, so a
      # tag named `dovetail--v9.9.9$(id)` -- legal to git, and a match for the
      # trigger above -- ran `id` on the runner with the workflow's token in the
      # environment. An `env:` value is data instead: the runner sets the
      # variable, and bash expands it quoted, without parsing what it holds.
      #
      # The ternary is kept even though `if:` already guarantees a tag push: it
      # is what makes `RELEASE_TAG` empty rather than unset in any case this
      # workflow has not thought of, and check-release.sh refuses an empty tag by
      # name instead of adopting it.
      - name: Release check (tag)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: bash scripts/check-release.sh --strict "$RELEASE_TAG"

      # No tag here, and `--head` says so rather than leaving it to be inferred
      # from an empty argument. It is also the only form that answers about the
      # commit this run checked out: the version in the manifests may well be
      # tagged already, and HEAD mode reports that as a failure to bump rather
      # than quietly grading the commit that tag points at.
      - name: Release check (HEAD)
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/check-release.sh --strict --head
